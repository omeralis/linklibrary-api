name: _test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.policy }} policy)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { policy: strict, scanning_coming_soon: 'false', allow_unverified: 'false' }
          - { policy: temporary, scanning_coming_soon: 'true', allow_unverified: 'true' }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci-only-throwaway, POSTGRES_DB: linklibrary_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: linklibrary_test
      DB_USERNAME: ci
      DB_PASSWORD: ci-only-throwaway
      APP_ENV: testing
      # Policy flags come ONLY from the matrix, never from .env.example (which carries deployment defaults).
      SECURITY_SCANNING_COMING_SOON: ${{ matrix.scanning_coming_soon }}
      SECURITY_ALLOW_UNVERIFIED_SHARING: ${{ matrix.allow_unverified }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, intl, mbstring, gd, bcmath, zip, xml, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --no-interaction
      - name: Minimal .env (APP_KEY only; nothing from .env.example)
        run: printf 'APP_KEY=%s\n' "$(php artisan key:generate --show)" > .env
      - if: matrix.policy == 'strict'
        run: vendor/bin/pint --test
      - if: matrix.policy == 'strict'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: php artisan config:clear && php artisan test --compact
